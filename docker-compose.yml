services:
  db:
    image: postgres:16-alpine
    container_name: internship_db
    environment:
      POSTGRES_DB: internship_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d internship_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: internship_web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=sqlite:////app/src/backend/internship_portal.db
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    networks:
      - app_net
    volumes:
      - uploads_data:/app/src/backend/uploads
    restart: unless-stopped

networks:
  app_net:

volumes:
  db_data:
  uploads_data: